<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bilingual Translate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #fcfcfb;
      color: #151515;
    }
    .header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid #e8e6dc;
      background: #ffffff;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
      color: #141413;
    }
    .header p {
      font-size: 12px;
      color: #87867f;
    }
    .section {
      padding: 14px 18px;
      border-bottom: 1px solid #f0eee6;
    }
    .section:last-child { border-bottom: none; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #87867f;
      margin-bottom: 10px;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .theme-btn {
      position: relative;
      padding: 10px 12px;
      border: 1.5px solid #e8e6dc;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }
    .theme-btn:hover {
      border-color: #d1cfc5;
      background: #faf9f5;
    }
    .theme-btn.active {
      border-color: #1a73e8;
      background: #f0f7ff;
    }
    .theme-btn.active::after {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 14px;
      color: #1a73e8;
      font-weight: 600;
    }
    .theme-name {
      font-size: 13px;
      font-weight: 500;
      color: #141413;
      margin-bottom: 2px;
    }
    .theme-desc {
      font-size: 11px;
      color: #87867f;
      line-height: 1.3;
    }
    .theme-preview {
      width: 100%;
      height: 3px;
      border-radius: 2px;
      margin-top: 6px;
    }
    .theme-btn[data-theme="default"] .theme-preview {
      background: linear-gradient(90deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,.18) 100%);
    }
    .theme-btn[data-theme="claude"] .theme-preview {
      background: linear-gradient(90deg, #c6613f 0%, #e08264 100%);
    }
    .primary {
      width: 100%; padding: 9px 12px; border: 0; border-radius: 8px;
      background: #1a73e8; color: #fff; font: 500 13px/1.2 inherit; cursor: pointer;
    }
    .primary:hover { filter: brightness(1.08); }
    .link {
      display: block;
      padding: 10px 12px;
      color: #1a73e8;
      text-decoration: none;
      font-size: 13px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .link:hover {
      background: #f0f7ff;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a19; color: #ececea; }
      .header { background: #1f1f1e; border-bottom-color: #2a2d32; }
      .header h1 { color: #ececea; }
      .header p { color: #9c9a92; }
      .section { border-bottom-color: #2a2d32; }
      .section-title { color: #9c9a92; }
      .theme-btn { background: #1f1f1e; border-color: #2a2d32; }
      .theme-btn:hover { background: #252524; border-color: #3d3d3a; }
      .theme-btn.active { background: #1a2332; border-color: #4285f4; }
      .theme-btn.active::after { color: #6ba3ff; }
      .theme-name { color: #ececea; }
      .theme-desc { color: #9c9a92; }
      .link { color: #6ba3ff; }
      .link:hover { background: #1a2332; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Bilingual Translate</h1>
    <p>Press Alt+A to toggle</p>
  </div>
  
  <div class="section">
    <button id="toggle" class="primary">Translate this page</button>
  </div>

  <div class="section">
    <div class="section-title">Theme</div>
    <div class="theme-grid">
      <button class="theme-btn" data-theme="default">
        <div class="theme-name">Default</div>
        <div class="theme-desc">Subtle gray</div>
        <div class="theme-preview"></div>
      </button>
      <button class="theme-btn" data-theme="claude">
        <div class="theme-name">Claude</div>
        <div class="theme-desc">Warm orange</div>
        <div class="theme-preview"></div>
      </button>
    </div>
  </div>

  <div class="section">
    <a href="options.html" target="_blank" class="link">⚙️ Language Settings</a>
    <a href="viewer.html" target="_blank" class="link">📄 Markdown Viewer</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
