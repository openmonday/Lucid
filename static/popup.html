<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Toolbox</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f4f2;--card:#fff;--soft:#ececea;--text:#1b1b1b;--sub:#6b6b68;--line:rgba(0,0,0,.08);--accent:#1a73e8;--accent-ink:#fff;--shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.08);--r:14px}
    @media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--soft:#2a2a2a;--text:#f1f1ef;--sub:#9b9b97;--line:rgba(255,255,255,.09);--accent:#5a9bff;--accent-ink:#0b1b33;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45)}}
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:300px;min-height:380px;padding:12px;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
    svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
    header{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
    header svg{color:var(--accent);width:22px;height:22px}
    h1{flex:1;font-size:15px;font-weight:650}
    kbd{font:600 10px/1 inherit;padding:4px 6px;border-radius:7px;background:var(--soft);color:var(--sub)}
    .panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px}
    .route{display:flex;align-items:center;gap:8px;padding:8px}
    .chip{height:36px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-radius:11px;background:var(--soft);white-space:nowrap}
    .chip.fixed{width:92px;color:var(--sub)}
    .route>svg{color:var(--sub);width:16px;height:16px}
    .dd{position:relative;flex:1;min-width:0}
    .dd-btn{width:100%;justify-content:space-between;font-weight:550}
    .dd-btn span{overflow:hidden;text-overflow:ellipsis}
    .dd-btn svg{width:14px;height:14px;color:var(--sub);transition:transform .15s}
    .dd.open .dd-btn svg{transform:rotate(180deg)}
    .menu{position:absolute;z-index:5;top:42px;right:0;width:200px;max-height:196px;overflow:auto;padding:5px;border-radius:14px;background:var(--card);box-shadow:var(--shadow),0 0 0 1px var(--line);display:none}
    .dd.open .menu{display:block}
    .menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
    .menu button:hover{background:var(--soft)}
    .menu button.sel{color:var(--accent);font-weight:600}
    .menu button svg{width:14px;height:14px;opacity:0}
    .menu button.sel svg{opacity:1}
    .go{width:100%;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:14px;box-shadow:var(--shadow);margin-bottom:10px;transition:filter .15s,transform .06s}
    .go:hover{filter:brightness(1.07)}.go:active{transform:scale(.985)}
    .line{display:flex;align-items:center;gap:10px;padding:11px 12px}
    .line>svg{color:var(--sub)}
    .line b{flex:1;font-weight:550}
    .switch{position:relative;width:40px;height:24px;border-radius:12px;background:var(--soft);transition:background .2s}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
    .switch.on{background:var(--accent)}.switch.on::after{transform:translateX(16px)}
    .seg-row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px}
    .seg-row>svg{color:var(--sub)}
    .seg{flex:1;display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--soft)}
    .seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:30px;border-radius:9px;color:var(--sub);font-weight:550;transition:background .15s,color .15s}
    .seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
    .dot{width:10px;height:10px;border-radius:5px;background:#8c8c88}
    [data-theme=claude] .dot{background:#d8795b}
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg>
    <h1>Toolbox</h1>
    <kbd>Alt+A</kbd>
  </header>

  <div class="panel route">
    <div class="chip fixed">Auto</div>
    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <div class="dd" id="dd">
      <button class="chip dd-btn" id="dd-btn" type="button"><span id="dd-label"></span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="menu" role="listbox"></div>
    </div>
  </div>

  <button class="go" id="toggle" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 9c1 3 3 5 6 6M12 9c-1 3-3 5-6 6M13 20l4-9 4 9M14.5 17h5"/></svg>Translate</button>

  <div class="panel line">
    <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    <b>Dark mode</b>
    <button class="switch" id="dark-switch" type="button" aria-label="Dark mode"></button>
  </div>

  <div class="panel seg-row">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <div class="seg" data-theme-group="translationTheme">
      <button type="button" data-theme="default"><i class="dot"></i>Plain</button>
      <button type="button" data-theme="claude"><i class="dot"></i>Claude</button>
    </div>
  </div>

  <div class="panel seg-row">
    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    <div class="seg" data-theme-group="viewerTheme">
      <button type="button" data-theme="default"><i class="dot"></i>Plain</button>
      <button type="button" data-theme="claude"><i class="dot"></i>Claude</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
