<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Bilingual Translate</title>
  <style>
    *{box-sizing:border-box}body{width:320px;margin:0;padding:14px 16px 16px;background:#171717;color:#eee;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;align-items:center;gap:10px;margin-bottom:14px}h1{font-size:14px;margin:0;font-weight:600}header span{color:#999;font-size:11px}.card{background:#242424;border-radius:11px;padding:12px;margin-bottom:10px}.route{display:grid;grid-template-columns:1fr 20px 1fr;gap:8px;align-items:center}.select{background:#303030;border:0;border-radius:9px;padding:10px;color:#ddd;font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;width:100%;text-align:center;text-align-last:center}.arrow{text-align:center;color:#aaa;font-size:18px}.primary{width:100%;border:0;border-radius:9px;padding:11px;background:#a92d5d;color:#fff;font-weight:600;font-size:14px;cursor:pointer}.primary:hover{background:#bd386c}.title{color:#aaa;font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme{border:1px solid #3b3b3b;border-radius:9px;padding:9px;background:#292929;color:#ddd;text-align:left;cursor:pointer}.theme.active{border-color:#d34b7a;background:#30232a}.theme:hover{border-color:#777}.theme strong{display:block;font-size:13px}.theme small{display:block;color:#999;margin-top:2px}.swatch{height:3px;border-radius:2px;margin-top:8px;background:#888}.theme[data-theme=claude] .swatch{background:#d8795b}.footer{display:flex;gap:8px;color:#999;font-size:11px;padding:2px 3px}.footer a{color:#aaa;text-decoration:none}.footer a:hover{color:#fff}
  </style>
</head>
<body>
  <header><h1>Bilingual Translate</h1><span>Alt+A</span></header>
  <div class="card"><div class="route"><div class="select">Auto detect</div><div class="arrow">→</div><select id="target" class="select"></select></div></div>
  <div class="card"><button id="toggle" class="primary">Translate</button></div>
  <div class="card"><div class="title">Translation text</div><div class="row" data-theme-group="translationTheme"><button class="theme" data-theme="default"><strong>Plain</strong><small>Subtle gray</small><div class="swatch"></div></button><button class="theme" data-theme="claude"><strong>Claude</strong><small>Warm clay</small><div class="swatch"></div></button></div></div>
  <div class="card"><div class="title">Markdown viewer</div><div class="row" data-theme-group="viewerTheme"><button class="theme" data-theme="default"><strong>Plain</strong><small>Neutral paper</small><div class="swatch"></div></button><button class="theme" data-theme="claude"><strong>Claude</strong><small>Warm paper</small><div class="swatch"></div></button></div></div>
    <script type="module" src="popup.js"></script>
</body>
</html>
