<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Bilingual Translate</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f7f6;--panel:#fff;--soft:#f0f0ef;--text:#202020;--muted:#777;--line:#ddd;--accent:#b52d60;--accent-hover:#c83c70}
    @media(prefers-color-scheme:dark){:root{--bg:#171717;--panel:#242424;--soft:#303030;--text:#eee;--muted:#999;--line:#414141;--accent:#b52d60;--accent-hover:#c83c70}}
    *{box-sizing:border-box}body{width:320px;margin:0;padding:14px 16px 16px;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;gap:9px;margin-bottom:14px}header svg{width:22px;height:22px;color:#1a73e8}h1{font-size:14px;margin:0;font-weight:600;flex:1}.key{color:var(--muted);font-size:11px}
    .card{background:var(--panel);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:11px;padding:11px;margin-bottom:9px}.route{display:grid;grid-template-columns:1fr 22px 1fr;gap:7px;align-items:center}.select{background:var(--soft);border:0;border-radius:8px;padding:9px;color:var(--text);font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;width:100%;text-align:center;text-align-last:center}.arrow{text-align:center;color:var(--muted);font-size:17px}
    .primary{width:100%;border:0;border-radius:8px;padding:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer}.primary:hover{background:var(--accent-hover)}
    .section{display:flex;align-items:center;gap:7px;margin:1px 1px 8px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.section svg{width:14px;height:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.theme{min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--soft);color:var(--text);text-align:left;cursor:pointer}.theme.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.theme:hover{border-color:var(--muted)}.theme strong{display:flex;align-items:center;gap:6px;font-size:12px}.theme svg{width:14px;height:14px}.theme small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.swatch{height:3px;border-radius:2px;margin-top:7px;background:#888}.theme[data-theme=claude] .swatch{background:#d8795b}
  </style>
</head>
<body>
  <header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="11" height="11" rx="2"/><path d="M8.5 7v3M7 8.5h3M13 13l8 8M17 13l-4 4"/></svg><h1>Bilingual Translate</h1><span class="key">Alt+A</span></header>
  <div class="card"><div class="route"><div class="select">Auto detect</div><div class="arrow">→</div><select id="target" class="select"></select></div></div>
  <div class="card"><button id="toggle" class="primary">Translate</button></div>
  <div class="card"><div class="section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Translation</span></div><div class="row" data-theme-group="translationTheme"><button class="theme" data-theme="default"><strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/></svg>Plain</strong><small>Subtle</small><div class="swatch"></div></button><button class="theme" data-theme="claude"><strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 18 12 4l7 14M8 13h8"/></svg>Claude</strong><small>Warm</small><div class="swatch"></div></button></div></div>
  <div class="card"><div class="section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><span>Viewer</span></div><div class="row" data-theme-group="viewerTheme"><button class="theme" data-theme="default"><strong>Plain</strong><small>Neutral</small><div class="swatch"></div></button><button class="theme" data-theme="claude"><strong>Claude</strong><small>Warm</small><div class="swatch"></div></button></div></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
